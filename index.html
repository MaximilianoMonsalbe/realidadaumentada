<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>BC-6800 Plus · AR anclada a mesa</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
  #c{position:fixed;inset:0;width:100vw;height:100vh;display:block;background:transparent}
  #overlay{position:fixed;inset:0;pointer-events:none;z-index:10}
  #topbar{position:fixed;top:0;left:0;right:0;padding:14px 16px;display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,0));z-index:20;pointer-events:none}
  #title{flex:1;font-size:15px;font-weight:600;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
  #status{padding:4px 8px;border-radius:999px;background:rgba(16,185,129,.18);color:#34d399;font-size:12px;font-weight:600;letter-spacing:.2px;border:1px solid rgba(16,185,129,.4);backdrop-filter:blur(6px)}
  #centerHUD{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;text-align:center;width:80%;max-width:420px;z-index:30;display:block}
  #centerHUD.hide{display:none}
  #toast{background:rgba(15,23,42,.78);border:1px solid rgba(148,163,184,.35);color:#f1f5f9;font-size:13px;padding:10px 14px;border-radius:10px;backdrop-filter:blur(10px);text-align:center;line-height:1.4}
  #bottombar{position:fixed;left:0;right:0;bottom:max(16px,env(safe-area-inset-bottom));padding:0 16px;display:flex;justify-content:center;align-items:center;gap:12px;z-index:40;flex-wrap:wrap}
  .btn{pointer-events:auto;border:0;cursor:pointer;padding:14px 22px;border-radius:14px;font-size:15px;font-weight:700;color:#fff;background:linear-gradient(180deg,#2563EB,#1D4ED8);box-shadow:0 8px 24px rgba(37,99,235,.45);letter-spacing:.2px}
  .btn.sec{background:rgba(15,23,42,.7);border:1px solid rgba(148,163,184,.35);box-shadow:none;color:#e2e8f0;backdrop-filter:blur(10px)}
  .btn.success{background:linear-gradient(180deg,#10b981,#059669);box-shadow:0 8px 24px rgba(16,185,129,.45)}
  #placedBanner{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);background:rgba(16,185,129,.9);color:#fff;padding:8px 14px;border-radius:999px;font-size:12px;font-weight:700;z-index:35;display:none;max-width:85%;text-align:center}
  #placedBanner.show{display:block}
  .hide{display:none !important}
  #scaleCtl{position:fixed;left:16px;bottom:180px;z-index:45;width:180px;pointer-events:auto;display:none;flex-direction:column;gap:6px;background:rgba(15,23,42,.6);padding:10px 12px;border-radius:12px;border:1px solid rgba(148,163,184,.3)}
  #scaleCtl.show{display:flex}
  #scaleCtl label{font-size:12px;color:#cbd5e1;font-weight:600}
  #scaleRange{width:100%}
  #scaleVal{font-size:12px;color:#fff;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="overlay">
  <div id="topbar">
    <div id="title">Mindray BC-6800 Plus · AR anclada a mesa</div>
    <div id="status">Cargando...</div>
  </div>
  <div id="centerHUD">
    <div id="toast">Descargando modelo 3D BC-6800... puede demorar 10-20 seg.</div>
  </div>
  <div id="placedBanner">✓ BC-6800 anclado a la mesa. Volvé a tocar para reubicar. Ajustá escala abajo.</div>

  <div id="scaleCtl">
    <label>Escala del equipo: <span id="scaleVal">1.00</span></label>
    <input id="scaleRange" type="range" min="0.2" max="4.0" step="0.05" value="1.00" />
  </div>

  <div id="bottombar">
    <button id="btnBack" class="btn sec">← Volver a la app</button>
    <button id="btnStart" class="btn hide">🚀 Iniciar AR</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
    "three/examples/": "https://unpkg.com/three@0.170.0/examples/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { STLLoader } from 'three/examples/jsm/loaders/STLLoader.js';

// Path RELATIVO a este HTML (siempre que bc6800.stl este EN EL MISMO DIRECTORIO
// que este webxr_standalone.html dentro de GitHub Pages). No hay que tocar nada.
const STL_URL = './bc6800.stl';

const canvas = document.getElementById('c');
const statusEl = document.getElementById('status');
const centerHUD = document.getElementById('centerHUD');
const toastEl = centerHUD.querySelector('#toast');
const placedBanner = document.getElementById('placedBanner');
const btnStart = document.getElementById('btnStart');
const btnBack = document.getElementById('btnBack');
const scaleCtl = document.getElementById('scaleCtl');
const scaleRange = document.getElementById('scaleRange');
const scaleVal = document.getElementById('scaleVal');

function flash(msg, durMs){
  toastEl.textContent = msg;
  centerHUD.classList.remove('hide');
  clearTimeout(flash._t);
  flash._t = setTimeout(()=>centerHUD.classList.add('hide'), durMs || 3000);
}
btnBack.addEventListener('click', () => {
  try {
    // Intentar volver por deep link a Expo dev client o tu app Expo.
    // Si falla, simplemente history.back.
    window.location.href = 'exp://';
  } catch(e) {}
  setTimeout(() => { try { window.history.back(); } catch {} }, 350);
});

let renderer, scene, camera, xrSession=null;
let reticle, modelGroup=null;
let hitTestSource=null, localSpace=null, viewerSpace=null;
let stlGeom=null;
let controller;
let modelScale = parseFloat(scaleRange.value);
scaleVal.textContent = modelScale.toFixed(2);

function updateModelScale(newScale){
  modelScale = newScale;
  scaleVal.textContent = modelScale.toFixed(2);
  if (modelGroup) modelGroup.scale.setScalar(modelScale);
}
scaleRange.addEventListener('input', (e) => updateModelScale(parseFloat(e.target.value)));

async function setupBaseline(){
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    renderer.xr.enabled = true;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;

    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 20);
    camera.position.set(0, 1.6, 0);

    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const dir = new THREE.DirectionalLight(0xffffff, 1.0);
    dir.position.set(2, 4, 3);
    scene.add(dir);
    const rim = new THREE.DirectionalLight(0x9bb8ff, 0.35);
    rim.position.set(-3, 2, -2);
    scene.add(rim);

    const rGeo = new THREE.RingGeometry(0.03, 0.06, 48);
    const rMat = new THREE.MeshBasicMaterial({ color: 0x22c55e, side: THREE.DoubleSide, transparent:true, opacity:0.95 });
    reticle = new THREE.Mesh(rGeo, rMat);
    reticle.rotation.x = -Math.PI/2;
    reticle.matrixAutoUpdate = false;
    reticle.visible = false;
    scene.add(reticle);

    window.addEventListener('resize', onResize);
    renderer.setAnimationLoop(() => renderer.render(scene, camera));

    // Cargar STL binario desde URL pública HTTP (sin base64).
    statusEl.textContent = 'Leyendo STL desde URL...';
    await loadSTLFromURL(STL_URL);
  } catch(e){
    console.error('setup ERR', e);
    statusEl.textContent = 'Error';
    flash('Error configurando WebGL: ' + String(e?.message || e), 9000);
  }
}

function onResize(){
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  if (camera && !renderer.xr.isPresenting){
    camera.aspect = w/h;
    camera.updateProjectionMatrix();
  }
}

async function loadSTLFromURL(url){
  try {
    if (!url) throw new Error('URL STL vacia.');
    flash('Descargando modelo BC-6800 (18.5 MB)... aguardá', 10000);
    const resp = await fetch(url, { cache: 'force-cache' });
    if (!resp.ok) throw new Error('fetch STL HTTP ' + resp.status + ' ' + resp.statusText);
    const buf = await resp.arrayBuffer();
    if (!buf || buf.byteLength < 100) throw new Error('STL tamaño invalido');
    statusEl.textContent = 'Parseando STL...';
    const loader = new STLLoader();
    const geom = loader.parse(buf);
    if (!geom || !geom.attributes?.position?.count) throw new Error('STL parse error: sin position');
    geom.computeVertexNormals();
    geom.computeBoundingBox();
    stlGeom = geom;

    // Auto escala inicial: el STL del BC-6800 ya fue exportado en METROS REALES
    // (FreeCAD aplicó 0.001 mm→m en el script convert_stp_to_glb.py).
    // Escala inicial = 1.0 (tamaño natural). Ajustable via slider (0.2x a 4.0x).
    updateModelScale(1.0);
    scaleRange.value = '1.0';

    centerHUD.classList.add('hide');
    btnStart.classList.remove('hide');
    statusEl.textContent = 'Modelo listo · Toca INICIAR AR';
    flash('✓ BC-6800 cargado (tris: ' + Math.round(geom.attributes.position.count/3) + ') · Tocá INICIAR AR', 4500);
  } catch (err) {
    console.error('loadSTL ERR:', err);
    statusEl.textContent = 'Error STL';
    flash('❌ No se pudo cargar el modelo STL: ' + (err?.message || String(err)), 15000);
  }
}

btnStart.addEventListener('click', async () => {
  if (!stlGeom) { flash('Aun se carga el modelo. Espera 2s.'); return; }
  try {
    const hasXR = ('xr' in navigator);
    if (!hasXR) throw new Error('Tu navegador no expone navigator.xr. Usá la app CHROME (actualizada) en Android + ARCore instalado.');
    const supported = await navigator.xr.isSessionSupported('immersive-ar');
    if (!supported) throw new Error('Tu celu no soporta WebXR immersive-ar. Necesitás Android 11+ y Serv. de Google Play para RA instalado.');
  } catch(e) {
    flash('❌ WebXR AR no soportado: ' + (e?.message || String(e)), 12000);
    return;
  }

  btnStart.classList.add('hide');
  statusEl.textContent = 'Escaneando superficie (3-5s)...';
  flash('Mové el celu de costado por la superficie 3-5s hasta que aparezca la anilla verde → TOCÁ', 7000);

  try {
    const domOverlayRoot = document.getElementById('overlay');
    const sessionInit = {
      requiredFeatures: ['local-floor', 'hit-test'],
      optionalFeatures: ['dom-overlay'],
    };
    if (domOverlayRoot) (sessionInit).domOverlay = { root: domOverlayRoot };
    const session = await navigator.xr.requestSession('immersive-ar', sessionInit);
    xrSession = session;
    await renderer.xr.setSession(session);

    session.addEventListener('end', () => {
      xrSession = null;
      hitTestSource = null;
      reticle.visible = false;
      btnStart.classList.remove('hide');
      statusEl.textContent = 'AR cerrada · Inicia de nuevo';
      placedBanner.classList.remove('show');
      scaleCtl.classList.remove('show');
    });

    const refSpaceViewer = await session.requestReferenceSpace('viewer');
    const refSpaceLocal = await session.requestReferenceSpace('local-floor');
    viewerSpace = refSpaceViewer;
    localSpace = refSpaceLocal;
    try { hitTestSource = await session.requestHitTestSource({ space: refSpaceViewer }); }
    catch(e){ console.warn('hitTestSource no disp', e); }

    controller = renderer.xr.getController(0);
    controller.addEventListener('selectstart', onSelect);
    scene.add(controller);

    renderer.setAnimationLoop(onXRFrame);
    statusEl.textContent = 'Tocá la superficie → coloca el BC-6800';
    flash('Tocá la superficie (con la anilla verde visible) para colocar el BC-6800', 5500);
  } catch(err) {
    console.error('requestSession ERR:', err);
    flash('❌ No se pudo iniciar WebXR AR: ' + (err?.message || String(err)), 12000);
    btnStart.classList.remove('hide');
  }
});

function onSelect(){
  if (!stlGeom) return;
  if (!reticle || !reticle.visible) {
    flash('No se detectó plano aun. Mové el celu de costado sobre la superficie.', 4000);
    return;
  }
  placeModelFromReticleMatrix(reticle.matrix);
}

function placeModelFromReticleMatrix(matRet){
  if (modelGroup) { scene.remove(modelGroup); }
  const g = new THREE.Group();
  const pos = new THREE.Vector3();
  const quat = new THREE.Quaternion();
  const scl = new THREE.Vector3();
  matRet.decompose(pos, quat, scl);
  g.position.copy(pos);
  g.position.y = pos.y + 0.003;
  g.quaternion.copy(quat);
  g.scale.setScalar(modelScale);

  // Rotacion para que el STL (Y up) quede parado correctamente:
  // FreeCAD exporta Y up, three en WebXR usa Z up local en mesh? No, three en todos los casos Y up.
  // Si al ponerlo queda acostado, descomentar:
  // g.rotateX(-Math.PI/2);

  const mat = new THREE.MeshStandardMaterial({ color: 0xd9dee6, metalness: 0.28, roughness: 0.72, side: THREE.DoubleSide });
  const mesh = new THREE.Mesh(stlGeom, mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  g.add(mesh);
  scene.add(g);
  modelGroup = g;
  scaleCtl.classList.add('show');
  placedBanner.classList.add('show');
  clearTimeout(placedBanner._t);
  placedBanner._t = setTimeout(()=>placedBanner.classList.remove('show'), 3500);
  statusEl.textContent = '✓ BC-6800 anclado · tocá de nuevo para reubicar';
}

function onXRFrame(_ts, frame){
  if (!frame || !xrSession) return;
  if (hitTestSource && localSpace) {
    const results = frame.getHitTestResults(hitTestSource);
    if (results && results.length) {
      const hit = results[0];
      const pose = hit.getPose(localSpace);
      if (pose) {
        reticle.matrix.fromArray(pose.transform.matrix);
        reticle.visible = true;
      }
    } else reticle.visible = false;
  }
  renderer.render(scene, camera);
}

setupBaseline();
</script>
</body>
</html>
